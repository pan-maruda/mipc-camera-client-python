[tool.poetry]
name = "mipc-camera-client"
version = "0.2.0.dev0"
description = "command-line interface and client library for MIPC IP cameras"
authors = ["Pan Maruda <panmaruda@protonmail.com>"]
readme = "README.md"
packages = [{ include = "mipc_camera_client" }]
include = [{ path = "docs", format = "sdist" }, { path = "tools", format = "sdist" }]
license = "BSD-3-Clause"
homepage = "https://github.com/brylee123/mipc-camera-client-python"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3.9",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Natural Language :: English",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop"
]
keywords = ["webcam", "mipc", "rtsp", "ip camera", "cli", "command line interface", "ptz"]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
json5 = "^0.9.14"
pycryptodome = "^3.18.0"
av = { version = ">=16,<20", optional = true }

[tool.poetry.extras]
audio = ["av"]


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.17.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
mipc_camera_client = 'mipc_camera_client.cli:main'

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Keep upstream protocol-vector argument names (including keyword `l`).
"mipc_camera_client/crypto_helpers.py" = ["E731", "E741"]
